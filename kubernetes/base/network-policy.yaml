apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: genomic-research-access-api
  labels:
    app.kubernetes.io/name: genomic-research-access-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: genomic-research-access-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-system
          podSelector:
            matchLabels:
              app.kubernetes.io/component: workload-proxy
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
