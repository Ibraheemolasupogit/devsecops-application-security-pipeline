name: Build and Publish

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      publication_mode:
        description: "Verify the candidate, or request publication after all gates pass"
        type: choice
        options: [verify, publish]
        default: verify
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: build-publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    name: Build once, assure, optionally publish
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # actions/setup-python v5.6.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: "pip"

      # hashicorp/setup-terraform v3.1.2
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: "1.16.5"

      - name: Install pinned project and security dependencies
        run: |
          python -m pip install --upgrade pip==25.1.1
          python -m pip install -e ".[dev,security]"

      - name: Quality assurance
        run: make quality

      - name: Build once and run supply-chain assurance
        run: make supply-chain-full

      - name: Verify candidate is publishable when publication is requested
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publication_mode == 'publish' }}
        env:
          PUBLICATION_ENABLED: ${{ vars.ENABLE_ECR_PUBLICATION }}
          PUBLISHER_ROLE_ARN: ${{ vars.ARTIFACT_PUBLISHER_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          ECR_REPOSITORY_URL: ${{ vars.ECR_REPOSITORY_URL }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$PUBLICATION_ENABLED" = "true"
          test -n "$PUBLISHER_ROLE_ARN"
          test -n "$AWS_REGION"
          test -n "$AWS_ACCOUNT_ID"
          test -n "$ECR_REPOSITORY_URL"
          test "$(python -c 'import json; print(json.load(open("outputs/security/supply-chain/publication-eligibility.json"))["status"])')" = "eligible"

      - name: Authenticate to AWS with GitHub OIDC
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publication_mode == 'publish' }}
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.ARTIFACT_PUBLISHER_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: graa-publisher-${{ github.run_id }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}

      - name: Publish the already-assured digest to ECR
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publication_mode == 'publish' }}
        env:
          SUPPLY_CHAIN_ALLOW_LIVE_PUBLICATION: ${{ vars.ENABLE_ECR_PUBLICATION }}
          SUPPLY_CHAIN_OIDC_AUTHENTICATED: "true"
          ECR_REPOSITORY_URL: ${{ vars.ECR_REPOSITORY_URL }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          ARTIFACT_PUBLISHER_ROLE_ARN: ${{ vars.ARTIFACT_PUBLISHER_ROLE_ARN }}
        run: python scripts/container_supply_chain.py publish

      - name: Upload candidate evidence
        if: ${{ always() && hashFiles('outputs/security/supply-chain/**') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: supply-chain-${{ github.sha }}-${{ github.run_id }}
          path: outputs/security/supply-chain/
          if-no-files-found: error
          retention-days: 14
