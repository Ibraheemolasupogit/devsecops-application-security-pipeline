apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: production
resources:
  - namespace.yaml
  - ../../base
  - resource-quota.yaml
  - limit-range.yaml
patches:
  - path: patches/deployment.yaml
configMapGenerator:
  - name: api-config
    envs:
      - config/prod.env
    options:
      immutable: true
      labels:
        app.kubernetes.io/name: genomic-research-access-api
        app.kubernetes.io/component: configuration
labels:
  - pairs:
      platform.example.com/environment: production
    includeTemplates: true
